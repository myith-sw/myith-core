components:
  schemas:
    SaveStarRequest:
      type: object
      properties:
        star:
          $ref: "#/components/schemas/StarInput"
          description: STAR 기록. 각 필드 trim 후 0~2000자. 임시 저장이므로 빈 값 허용
        source:
          type: string
          description: 출처. manual | ai-assisted
          enum:
          - manual
          - ai-assisted
          example: manual
        aiEnhancementId:
          type: string
          description: AI 보완을 적용한 경우 해당 요청 ID
          example: null
    StarInput:
      type: object
      properties:
        situation:
          type: string
          description: 상황(S)
          example: 팀 프로젝트에서 API 응답이 3초 이상 걸리는 문제가 발생했다.
          maxLength: 2000
          minLength: 0
        task:
          type: string
          description: 과제(T)
          example: 응답 시간을 500ms 이하로 줄여야 했다.
          maxLength: 2000
          minLength: 0
        action:
          type: string
          description: 행동(A)
          example: N+1 쿼리를 페치 조인으로 개선하고 Redis 캐시를 도입했다.
          maxLength: 2000
          minLength: 0
        result:
          type: string
          description: 결과(R)
          example: 평균 응답 시간이 200ms로 감소했다.
          maxLength: 2000
          minLength: 0
    PresignRequest:
      type: object
      properties:
        fileName:
          type: string
          description: 업로드할 파일 이름
          example: portfolio.pdf
        contentType:
          type: string
          description: "MIME 타입. application/pdf, image/png, image/jpeg만 허용"
          example: application/pdf
      required:
      - contentType
      - fileName
    AnswerRequest:
      type: object
      properties:
        skillCode:
          type: string
          description: 스킬 코드
          example: git
        level:
          type: string
          description: 자가진단 수준. unknown|heard|tried|independent
          enum:
          - unknown
          - heard
          - tried
          - independent
          example: tried
      required:
      - level
      - skillCode
    CreateRoadmapRequest:
      type: object
      properties:
        jobCode:
          type: string
          description: "직무 코드. GET /api/jobs에서 available: true인 것만 가능"
          example: server
        profileVersion:
          type: integer
          format: int32
          description: "GET /api/jobs/{jobCode}/diagnosis에서 받은 프로필 버전"
          example: 1
        species:
          type: string
          description: 캐릭터 종류. 프론트 assets 22종 중 택 1. enum이 아닌 문자열
          example: deokbaseu
        nickname:
          type: string
          description: 캐릭터 닉네임. trim 후 1~20자
          example: 견습 서버 개발자
          maxLength: 20
          minLength: 1
        answers:
          type: array
          description: 자가진단 응답 목록. 모든 필수 문항에 대해 응답해야 한다
          items:
            $ref: "#/components/schemas/AnswerRequest"
        narrative:
          $ref: "#/components/schemas/NarrativeRequest"
          description: 서술형 입력. 하나라도 있으면 202 비동기 분석
        repoUrl:
          type: string
          description: GitHub 저장소 URL (optional)
          example: https://github.com/user/community
        fileKey:
          type: string
          description: POST /api/uploads/presign에서 받은 파일 키 (optional)
          example: portfolio/usr_01J3ABC/9f2c1d.pdf
      required:
      - answers
      - jobCode
      - profileVersion
      - species
    NarrativeRequest:
      type: object
      properties:
        experience:
          type: string
          description: 경험 서술
          example: 스프링으로 커뮤니티 CRUD를 만들어봤습니다.
        strength:
          type: string
          description: 강점 서술
          example: Java와 Spring이 가장 익숙합니다.
        difficulty:
          type: string
          description: 어려움 서술
          example: 성능 최적화는 아직 해본 적이 없습니다.
    AddQuestRequest:
      type: object
      properties:
        title:
          type: string
          description: 퀘스트 제목. 1~80자
          example: 사이드 프로젝트를 운영한다
          maxLength: 80
          minLength: 1
        axisCode:
          type: string
          description: 역량 축 코드
          example: server-api
        level:
          type: integer
          format: int32
          description: 레벨. 해당 로드맵의 레벨 범위 내
          example: 3
      required:
      - axisCode
      - level
      - title
    AiEnhancementRequest:
      type: object
      properties:
        star:
          $ref: "#/components/schemas/StarInput"
          description: AI 보완 대상 STAR 원문
        locale:
          type: string
          description: 로케일
          example: ko-KR
        style:
          type: string
          description: 문체 스타일
          example: concise-professional
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: 리프레시 토큰
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c3JfMDFKM0FCQyJ9.xyz
      required:
      - refreshToken
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google에서 받은 ID Token
          example: eyJhbGciOiJSUzI1NiIs...
      required:
      - idToken
    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 변경할 닉네임. trim 후 1~20자
          example: 새이름
          maxLength: 20
          minLength: 1
        profileImageUrl:
          type: string
          description: 변경할 프로필 이미지 URL
          example: https://example.com/avatar.png
    ReorderRequest:
      type: object
      properties:
        questId:
          type: integer
          format: int64
          description: 이동할 퀘스트 ID (서버 내부 ID)
          example: 2
        targetLevel:
          type: integer
          format: int32
          description: 이동 대상 레벨
          example: 1
        targetIndex:
          type: integer
          format: int32
          description: 이동 대상 인덱스 (0부터)
          example: 0
        version:
          type: integer
          format: int64
          description: 낙관적 락 버전
          example: 3
      required:
      - questId
      - targetIndex
      - targetLevel
      - version
    CompleteRequest:
      type: object
      properties:
        completed:
          type: boolean
          description: "true: 완료 / false: 완료 취소"
          example: true
        version:
          type: integer
          format: int64
          description: "낙관적 락 버전. GET /api/roadmaps/{id} 또는 GET /api/quests/{id}에서\
            \ 받은 version"
          example: 3
      required:
      - completed
      - version
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
