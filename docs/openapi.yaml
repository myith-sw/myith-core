        format=pdf: 원본 STAR 열람용 PDF (Content-Type: application/pdf, 한글 폰트 임베딩).
        대상: 해당 로드맵의 star IS NOT NULL인 경험 카드 전체(완성도 무관).
      operationId: export
      parameters:
      - name: roadmapId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: format
        in: query
        description: 내보내기 형식. md(자소서 프롬프트) 또는 pdf(원본 STAR)
        required: false
        schema:
          type: string
          enum:
          - md
          - pdf
      responses:
        "200":
          description: 파일 다운로드
          headers:
            Content-Disposition:
              description: 파일명. UTF-8 인코딩
              style: simple
              schema:
                example: attachment; filename*=UTF-8''myith-server-export.md
          content:
            text/markdown:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: INVALID_EXPORT_FORMAT — format이 md/pdf가 아님
          content:
            application/json:
              example:
                error:
                  code: INVALID_EXPORT_FORMAT
                  message: 지원하지 않는 내보내기 형식입니다. md 또는 pdf만 가능합니다.
                  requestId: req_01J3ABC
        "409":
          description: NO_EXPORTABLE_EXPERIENCE — 내보낼 STAR 기록이 없음
