                  axisCode: server-api
                  axisName: "서버·API"
                  level: 3
                  status: OPEN
                  source: CUSTOM
                  order: 4
                  version: 0
        '422':
          description: "VALIDATION_ERROR — title 1~80자, level은 해당 로드맵의 레벨 범위 내"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
