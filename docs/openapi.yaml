            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VERSION_CONFLICT
                  message: 다른 요청과 충돌했습니다. 새로고침 후 다시 시도해주세요.
                  requestId: req_01J3ABC

  /api/roadmaps/{roadmapId}/quests/{questId}:
    delete:
      tags: [Roadmap]
      summary: 퀘스트 삭제
      operationId: deleteQuest
      description: source가 CUSTOM인 사용자 정의 퀘스트만 삭제할 수 있다.
      parameters:
        - { name: roadmapId, in: path, required: true, schema: { type: string }, example: rmp_01J3ABC }
        - { name: questId, in: path, required: true, schema: { type: string }, example: qst_99 }
      responses:
        '204':
          description: 삭제 성공
        '403':
          description: CUSTOM_QUEST_ONLY — 사용자 정의 퀘스트가 아닌데 삭제 시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CUSTOM_QUEST_ONLY
                  message: 사용자 정의 퀘스트만 삭제할 수 있습니다.
                  requestId: req_01J3ABC

  # ═══════════════════ Quest ═══════════════════
  /api/quests/{questId}:
    get:
      tags: [Quest]
      summary: 퀘스트 상세 조회
      operationId: getQuestDetail
      description: |-
        화면 4-2(퀘스트 상세 + STAR).
        ncsUnit은 source: CUSTOM이면 null이다.
        certifications는 연계 자격 전부를 내린다. 없으면 빈 배열(프론트가 '해당 없음' 표시).
        star가 null이면 입력칸을 빈 값으로 시작한다.
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: string
          example: qst_05
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuestDetail'
              example:
                data:
                  questId: qst_05
                  roadmapId: rmp_01J3ABC
                  level: 5
                  axisCode: cs
                  axisName: "CS·자료구조"
                  title: CS 면접 질문을 정리한다
                  status: OPEN
                  source: ACTIVITY
                  order: 1
                  version: 0
                  completionCriteria: "네트워크·OS·DB 핵심 답안을 정리한다"
                  ncsUnit:
                    code: 2001010701_16v3
                    name: 응용SW기초기술활용
                    description: "자료구조와 알고리즘 등 기초 기술을 활용하는 능력"
                  certifications:
                    - name: 정보처리기사
                  star: null
                  starSource: null
                  updatedAt: "2026-07-24T03:00:00Z"

  /api/quests/{questId}/star:
    put:
      tags: [Quest]
      summary: STAR 기록 저장 (임시 저장)
      operationId: saveStar
      description: |-
        각 필드 trim 후 0~2000자. 임시 저장이므로 빈 값을 허용한다.
        최초 저장 시 퀘스트 상태가 OPEN → PENDING으로 바뀐다.
        프론트는 textarea blur 또는 debounce로 호출한다.
        AI 제안을 적용해 저장한 경우 source: "ai-assisted" + aiEnhancementId를 채운다.
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: string
          example: qst_05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStarRequest'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SaveStarResponse'
              example:
                data:
                  questId: qst_05
                  star:
                    situation: "팀 프로젝트에서 API 응답이 3초 이상 걸리는 문제가 발생했다."
                    task: "응답 시간을 500ms 이하로 줄여야 했다."
                    action: "N+1 쿼리를 페치 조인으로 개선하고 Redis 캐시를 도입했다."
                    result: "평균 응답 시간이 200ms로 감소했다."
                  source: manual
                  status: PENDING
                  updatedAt: "2026-07-24T03:10:00Z"
        '409':
          description: QUEST_LOCKED — 잠긴 퀘스트에 쓰기 시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: QUEST_LOCKED
                  message: 선행 퀘스트를 먼저 완료해주세요.
                  requestId: req_01J3ABC

  /api/quests/{questId}/complete:
    patch:
      tags: [Quest]
      summary: 퀘스트 완료 토글
      operationId: toggleComplete
      description: |-
        STAR 본문은 여기서 보내지 않는다. PUT /star로 이미 저장된 값을 쓴다.
        응답에 radar를 함께 내려 프론트가 레이더를 재조회 없이 갱신하게 한다.
        409 VERSION_CONFLICT 응답에는 최신 version을 포함해 프론트가 재시도할 수 있게 한다.
      parameters:
        - { name: Idempotency-Key, in: header, description: "멱등성 키 (optional)", required: false, schema: { type: string } }
        - { name: questId, in: path, required: true, schema: { type: string }, example: qst_05 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          description: 완료 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompleteResponse'
              example:
                data:
                  quest:
                    questId: qst_05
                    status: DONE
                    completedAt: "2026-07-24T03:20:00Z"
                    version: 4
                  characterChanges:
                    completionRate: 84
                    stage: 4
                    stageLabel: 완성
                    level: 5
                    nextQuest: { questId: qst_06, title: "테스트 코드를 작성한다" }
                  unlockedQuestIds: [qst_07]
                  radar:
                    - { axisCode: programming, axisName: "프로그래밍 기초", percent: 72 }
                    - { axisCode: cs, axisName: "CS·자료구조", percent: 80 }
                    - { axisCode: database, axisName: "데이터입출력", percent: 18 }
                    - { axisCode: server-api, axisName: "서버·API", percent: 67 }
                    - { axisCode: collaboration, axisName: "협업·형상관리", percent: 90 }
                    - { axisCode: deploy, axisName: "배포·운영", percent: 10 }
        '409':
          description: VERSION_CONFLICT / QUEST_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VERSION_CONFLICT:
                  value:
                    error: { code: VERSION_CONFLICT, message: "다른 요청과 충돌했습니다. 새로고침 후 다시 시도해주세요.", requestId: req_01J3ABC }
                QUEST_LOCKED:
                  value:
                    error: { code: QUEST_LOCKED, message: "선행 퀘스트를 먼저 완료해주세요.", requestId: req_01J3ABC }

  /api/quests/{questId}/ai-enhancements:
    post:
      tags: [Quest]
      summary: STAR AI 보완 요청
      operationId: requestAiEnhancement
      description: |-
        STAR 원문을 AI에게 보내 보완 제안·피드백·자기소개서 초안을 받는다.
        서버는 원문을 수정하지 않는다. 사용자가 '적용'을 누르면 프론트가 textarea를 채우고 PUT /star로 저장한다.
        202 수신 후 프론트가 GET /api/ai-enhancements/{requestId}를 짧은 간격으로 폴링한다.
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: string
          example: qst_05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiEnhancementRequest'
      responses:
        '202':
          description: 비동기 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requestId:
                        type: string
              example:
                data:
                  requestId: aie_01J3ABC
        '409':
          description: QUEST_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: QUEST_LOCKED, message: "선행 퀘스트를 먼저 완료해주세요.", requestId: req_01J3ABC }
        '422':
          description: AI_INPUT_TOO_LONG / AI_SAFETY_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: AI_INPUT_TOO_LONG, message: "입력이 너무 깁니다. 각 항목을 2000자 이내로 작성해주세요.", requestId: req_01J3ABC }
        '429':
          description: AI_RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: AI_RATE_LIMITED, message: "AI 요청 한도를 초과했습니다. 잠시 후 다시 시도해주세요.", requestId: req_01J3ABC }

  /api/ai-enhancements/{requestId}:
    get:
      tags: [Quest]
      summary: AI 보완 결과 조회
      operationId: getAiEnhancementResult
      description: |-
        POST /api/quests/{questId}/ai-enhancements에서 202 수신 후 프론트가 짧은 간격으로 폴링한다.
        enhancedStar → 비교 모달 오른쪽 / feedback → 항목별 힌트 / resumeDraft → 자기소개서 초안 영역.
        서버는 원문을 수정하지 않는다. 사용자가 '적용'을 누르면 프론트가 textarea를 채우고 PUT /star로 저장한다.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "상태에 따라 PROCESSING / COMPLETED / FAILED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiEnhancementResult'
              examples:
                PROCESSING:
                  value:
                    data:
                      requestId: aie_01J3ABC
                      status: PROCESSING
                COMPLETED:
                  value:
                    data:
                      requestId: aie_01J3ABC
                      questId: qst_05
                      status: COMPLETED
                      enhancedStar:
                        situation: "4인 팀 프로젝트에서 메인 API 엔드포인트의 평균 응답 시간이 3.2초로 측정되어 사용자 이탈이 증가했다."
                        task: "2주 내에 응답 시간을 500ms 이하로 줄이는 성능 개선 방안을 수립·적용해야 했다."
                        action: "JPA N+1 문제를 분석하여 페치 조인과 배치 사이즈 최적화를 적용하고, 반복 조회 데이터에 Redis 캐시를 도입했다."
                        result: "평균 응답 시간이 3.2초에서 180ms로 94% 감소했고, 이탈률이 15% 개선되었다."
                      feedback:
                        - field: action
                          issue: "'캐시 적용'이 추상적입니다"
                          suggestion: "어떤 데이터에 어떤 캐시를 적용했는지 구체화하세요"
                      resumeDraft: "대용량 조회 성능 문제를 캐시 도입으로 해결한 경험이 있습니다. ..."
                      createdAt: "2026-07-24T03:25:00Z"
                FAILED:
                  value:
                    data:
                      requestId: aie_01J3ABC
                      status: FAILED
                      errorCode: AI_PROVIDER_TIMEOUT

