  /api/roadmaps/{roadmapId}/export:
    get:
      tags: [Dashboard]
      summary: 로드맵 내보내기
      operationId: export
      description: |-
        format=md: 자소서 생성용 프롬프트 문서 (Content-Type: text/markdown; charset=utf-8).
        format=pdf: 원본 STAR 열람용 PDF (Content-Type: application/pdf, 한글 폰트 임베딩).
        대상: 해당 로드맵의 star IS NOT NULL인 경험 카드 전체(완성도 무관).
      parameters:
        - { name: roadmapId, in: path, required: true, schema: { type: string }, example: rmp_01J3ABC }
        - name: format
          in: query
          description: "내보내기 형식. md(자소서 프롬프트) 또는 pdf(원본 STAR)"
          required: false
          schema:
            type: string
            default: md
            enum: [md, pdf]
      responses:
        '200':
          description: 파일 다운로드
          headers:
            Content-Disposition:
              description: "파일명. UTF-8 인코딩"
              schema:
                type: string
                example: "attachment; filename*=UTF-8''myith-server-export.md"
          content:
            text/markdown:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: INVALID_EXPORT_FORMAT — format이 md/pdf가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: INVALID_EXPORT_FORMAT, message: "지원하지 않는 내보내기 형식입니다. md 또는 pdf만 가능합니다.", requestId: req_01J3ABC }
        '409':
          description: NO_EXPORTABLE_EXPERIENCE — 내보낼 STAR 기록이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: NO_EXPORTABLE_EXPERIENCE, message: "내보낼 경험 기록이 없습니다. STAR를 먼저 작성해주세요.", requestId: req_01J3ABC }

  # ═══════════════════ Desktop ═══════════════════
  /api/heartbeat:
    post:
      tags: [Desktop]
      summary: 하트비트
      operationId: heartbeat
      description: |-
        Electron 상주 앱 전용이다. 웹 프론트는 호출하지 않는다.
        서버는 마지막 실제 서비스 활동 시각 기준으로 48시간 미접속을 판정해 nudge: true로 응답한다.
        heartbeat 자체는 활동 시각을 갱신하지 않는다(갱신하면 48시간이 영원히 지나지 않는다).
        캐릭터가 없으면 characterState: null.
      responses:
        '200':
          description: 응답
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HeartbeatResponse'
              example:
                data:
                  nudge: true
                  characterState:
                    species: deokbaseu
                    stage: 4
                    completionRate: 80

  # ═══════════════════ Ops ═══════════════════
  /api/health:
    get:
      tags: [Ops]
      summary: 헬스체크
      operationId: health
      description: |-
        서버 상태를 확인한다.
        이 엔드포인트는 data 래퍼를 사용하지 않는 유일한 엔드포인트다.
        모니터링 도구(AWS ALB, k8s probe 등) 호환을 위해 래퍼 없이 평문 JSON을 반환한다.
      security: []
      responses:
        '200':
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                time: "2026-07-24T03:00:00Z"

# ══════════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums ──
    QuestStatus:
      type: string
      enum: [LOCKED, OPEN, PENDING, DONE, ALREADY_KNOWN]
    QuestSource:
      type: string
      enum: [SKILL, ACTIVITY, CUSTOM]
    StarSource:
      type: string
      enum: [manual, ai-assisted]
    GenerationState:
      type: string
      enum: [PENDING, ANALYZING, READY, FAILED]
    RoadmapStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ExportFormat:
      type: string
      enum: [md, pdf]
    AiRequestStatus:
      type: string
      enum: [PROCESSING, COMPLETED, FAILED]

    # ── Common ──
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: QUEST_LOCKED
        message:
          type: string
          example: "선행 퀘스트를 먼저 완료해주세요."
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          nullable: true
        requestId:
          type: string
          example: req_01J3ABC
    Meta:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
        retryAfterSeconds:
          type: integer
          nullable: true

    # ── Shared building blocks ──
    AxisItem:
      type: object
      properties:
        axisCode:
          type: string
          description: "역량 축 코드. enum이 아닌 자유 문자열"
        axisName:
          type: string
        percent:
          type: integer
          description: "단순 완료율 = (DONE+ALREADY_KNOWN)/전체 × 100"
      required: [axisCode, axisName, percent]

    StarInput:
      type: object
      properties:
        situation:
          type: string
          maxLength: 2000
        task:
          type: string
          maxLength: 2000
        action:
          type: string
          maxLength: 2000
        result:
          type: string
          maxLength: 2000

    NextQuest:
      type: object
      nullable: true
      properties:
        questId:
          type: string
        title:
          type: string

    QuestItem:
      type: object
      properties:
        questId:
          type: string
        title:
          type: string
        axisCode:
          type: string
        axisName:
          type: string
        status:
          $ref: '#/components/schemas/QuestStatus'
          description: "화면 4-1 카드 상태(잠금 자물쇠/완료/이미보유 뱃지)"
        source:
          $ref: '#/components/schemas/QuestSource'
        order:
          type: integer
        version:
          type: integer
          format: int64
        level:
          type: integer
      required: [questId, title, axisCode, axisName, status, source, order, version]

    LevelGroup:
      type: object
      properties:
        level:
          type: integer
        quests:
          type: array
          items:
            $ref: '#/components/schemas/QuestItem'
      required: [level, quests]

    NcsUnit:
      type: object
      nullable: true
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string

    CertItem:
      type: object
      properties:
        name:
          type: string

    FeedbackEntry:
      type: object
      properties:
        field:
          type: string
          enum: [situation, task, action, result]
        issue:
          type: string
        suggestion:
          type: string

    ExperienceCard:
      type: object
      properties:
        experienceId:
          type: string
        questId:
          type: string
        title:
          type: string
        axisCode:
          type: string
        axisName:
          type: string
        ncsUnitName:
          type: string
          nullable: true
        star:
          $ref: '#/components/schemas/StarInput'
        createdAt:
          type: string
          format: date-time

    # ── Auth ──
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
    GoogleLoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        isNewUser:
          type: boolean
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        profileImageUrl:
          type: string
          nullable: true

    # ── Upload ──
    PresignRequest:
      type: object
      required: [fileName, contentType]
      properties:
        fileName:
          type: string
        contentType:
          type: string
    PresignResponse:
      type: object
      properties:
        uploadUrl:
          type: string
        fileKey:
          type: string
        expiresIn:
          type: integer

    # ── Catalog ──
    JobListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      properties:
        categoryCode:
          type: string
        categoryName:
          type: string
        sortOrder:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
    JobItem:
      type: object
      properties:
        jobCode:
          type: string
          description: "직무 코드. enum이 아닌 자유 문자열"
        jobName:
          type: string
        tagline:
          type: string
          description: "화면 2 직무 카드 설명문, 로드맵 상세 상단"
        keywords:
          type: array
          items:
            type: string
          description: "화면 2 직무 카드 하단 키워드 5개. 프로필 없으면 빈 배열"
        available:
          type: boolean
          description: "false면 화면 2에서 '준비중' 잠긴 카드"
    DiagnosisResponse:
      type: object
      properties:
        jobCode:
          type: string
        profileVersion:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisQuestion'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisLevel'
    DiagnosisQuestion:
      type: object
      properties:
        skillCode:
          type: string
        text:
          type: string
        axisCode:
          type: string
        axisName:
          type: string
        sortOrder:
          type: integer
    DiagnosisLevel:
      type: object
      properties:
        id:
          type: string
          enum: [unknown, heard, tried, independent]
        label:
          type: string
        mastery:
          type: number

    # ── Roadmap ──
    CharacterSummary:
      type: object
      properties:
        characterId:
          type: string
        roadmapId:
          type: string
        species:
          type: string
          description: "캐릭터 종류. enum이 아닌 자유 문자열. 이미지 파일명 {species}-{stage}.png에 사용"
        nickname:
          type: string
          description: "홈 화면(1-2) 카드 큰 제목, 사이드바 첫 줄"
        jobCode:
          type: string
          description: "직무 코드. enum이 아닌 자유 문자열"
        jobName:
          type: string
          description: "홈 화면 카드 작은 글씨, 로드맵 상세 상단"
        tagline:
          type: string
        roadmapStatus:
          $ref: '#/components/schemas/RoadmapStatus'
        completionRate:
          type: integer
        stage:
          type: integer
          minimum: 1
          maximum: 4
        stageLabel:
          type: string
          enum: [시작, 성장, 숙련, 완성]
        level:
          type: integer
        nextQuest:
          $ref: '#/components/schemas/NextQuest'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRoadmapRequest:
      type: object
      required: [jobCode, profileVersion, species, answers]
      properties:
        jobCode:
          type: string
        profileVersion:
          type: integer
        species:
          type: string
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerRequest'
        narrative:
          $ref: '#/components/schemas/NarrativeRequest'
        repoUrl:
          type: string
          nullable: true
        fileKey:
          type: string
          nullable: true
    AnswerRequest:
      type: object
      required: [skillCode, level]
      properties:
        skillCode:
          type: string
        level:
          type: string
          enum: [unknown, heard, tried, independent]
    NarrativeRequest:
      type: object
      properties:
        experience:
          type: string
        strength:
          type: string
        difficulty:
          type: string
    CreateRoadmapResponse:
      type: object
      properties:
        roadmapId:
          type: string
        generationState:
          $ref: '#/components/schemas/GenerationState'

    RoadmapDetail:
      type: object
      properties:
        roadmapId:
          type: string
        generationState:
          $ref: '#/components/schemas/GenerationState'
        roadmapStatus:
          $ref: '#/components/schemas/RoadmapStatus'
        jobCode:
          type: string
        jobName:
          type: string
        tagline:
          type: string
        character:
          $ref: '#/components/schemas/RoadmapCharacter'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelGroup'
        updatedAt:
          type: string
          format: date-time
    RoadmapCharacter:
      type: object
      properties:
        characterId:
          type: string
        species:
          type: string
        nickname:
          type: string
        stage:
          type: integer
          minimum: 1
          maximum: 4
          description: "캐릭터 이미지 파일명 숫자. {species}-{stage}.png"
        stageLabel:
          type: string
          enum: [시작, 성장, 숙련, 완성]
          description: "캐릭터 옆 텍스트 (시작/성장/숙련/완성)"
        completionRate:
          type: integer

    AddQuestRequest:
      type: object
      required: [title, axisCode, level]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        axisCode:
          type: string
        level:
          type: integer
    ReorderRequest:
      type: object
      required: [questId, targetLevel, targetIndex, version]
      properties:
        questId:
          type: string
          description: 이동할 퀘스트 ID
          example: qst_02
        targetLevel:
          type: integer
        targetIndex:
          type: integer
        version:
          type: integer
          format: int64

    # ── Quest ──
    QuestDetail:
      type: object
      properties:
        questId:
          type: string
        roadmapId:
          type: string
        level:
          type: integer
        axisCode:
          type: string
        axisName:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/QuestStatus'
        source:
          $ref: '#/components/schemas/QuestSource'
        order:
          type: integer
        version:
          type: integer
          format: int64
        completionCriteria:
          type: string
          nullable: true
          description: "화면 4-2 '완료 기준' 박스"
        ncsUnit:
          $ref: '#/components/schemas/NcsUnit'
          description: "화면 4-2 'NCS 능력단위 근거' 박스. null이면 섹션 숨김"
        certifications:
          type: array
          items:
            $ref: '#/components/schemas/CertItem'
          description: "화면 4-2 '추천 자격'. 빈 배열이면 '해당 없음'"
        star:
          oneOf:
            - $ref: '#/components/schemas/StarInput'
            - type: 'null'
          description: "화면 4-2 STAR 입력칸 초기값. 아직 작성 전이면 null"
        starSource:
          oneOf:
            - $ref: '#/components/schemas/StarSource'
            - type: 'null'
        updatedAt:
          type: string
          format: date-time

    SaveStarRequest:
      type: object
      properties:
        star:
          $ref: '#/components/schemas/StarInput'
        source:
          $ref: '#/components/schemas/StarSource'
        aiEnhancementId:
          type: string
          nullable: true
    SaveStarResponse:
      type: object
      properties:
        questId:
          type: string
        star:
          $ref: '#/components/schemas/StarInput'
        source:
          $ref: '#/components/schemas/StarSource'
        status:
          $ref: '#/components/schemas/QuestStatus'
        updatedAt:
          type: string
          format: date-time

    CompleteRequest:
      type: object
      required: [completed, version]
      properties:
        completed:
          type: boolean
        version:
          type: integer
          format: int64
    CompleteResponse:
      type: object
      properties:
        quest:
          type: object
          properties:
            questId:
              type: string
            status:
              $ref: '#/components/schemas/QuestStatus'
            completedAt:
              type: string
              format: date-time
            version:
              type: integer
              format: int64
        characterChanges:
          type: object
          properties:
            completionRate:
              type: integer
            stage:
              type: integer
              minimum: 1
              maximum: 4
            stageLabel:
              type: string
              enum: [시작, 성장, 숙련, 완성]
            level:
              type: integer
            nextQuest:
              $ref: '#/components/schemas/NextQuest'
        unlockedQuestIds:
          type: array
          items:
            type: string
        radar:
          type: array
          items:
            $ref: '#/components/schemas/AxisItem'

    AiEnhancementRequest:
      type: object
      properties:
        star:
          $ref: '#/components/schemas/StarInput'
        locale:
          type: string
        style:
          type: string
    AiEnhancementResult:
      type: object
      properties:
        requestId:
          type: string
        questId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AiRequestStatus'
        enhancedStar:
          oneOf:
            - $ref: '#/components/schemas/StarInput'
            - type: 'null'
          description: "화면 4-2 AI 비교 모달 오른쪽. status가 PROCESSING이면 아직 없음"
        feedback:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FeedbackEntry'
          description: "화면 4-2 항목별 개선 힌트"
        resumeDraft:
          type: string
          nullable: true
          description: "화면 4-2·5 자기소개서 초안 영역"
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
      required: [requestId, status]

    # ── Dashboard ──
    DashboardResponse:
      type: object
      properties:
        character:
          $ref: '#/components/schemas/DashboardCharacter'
        radar:
          type: array
          items:
            $ref: '#/components/schemas/AxisItem'
          description: "화면 5 역량 다각형(레이더). 축 개수는 직무마다 4~7개 가변"
        skillTree:
          type: array
          items:
            $ref: '#/components/schemas/SkillTreeLevel'
        experienceCards:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceCard'
          description: "화면 5 경험 카드 목록"
        updatedAt:
          type: string
          format: date-time
    DashboardCharacter:
      type: object
      properties:
        nickname:
          type: string
        jobName:
          type: string
        species:
          type: string
        stage:
          type: integer
          minimum: 1
          maximum: 4
        stageLabel:
          type: string
          enum: [시작, 성장, 숙련, 완성]
        completionRate:
          type: integer
        completedQuestCount:
          type: integer
        level:
          type: integer
    SkillTreeLevel:
      type: object
      properties:
        level:
          type: integer
        quests:
          type: array
          items:
            type: object
            properties:
              questId:
                type: string
              title:
                type: string
              axisCode:
                type: string
              axisName:
                type: string
              status:
                $ref: '#/components/schemas/QuestStatus'

    # ── Desktop ──
    HeartbeatResponse:
      type: object
      properties:
        nudge:
          type: boolean
        characterState:
          type: object
          nullable: true
          properties:
            species:
              type: string
            stage:
              type: integer
              minimum: 1
              maximum: 4
            completionRate:
              type: integer

    # ── Ops ──
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
