spring:
  application:
    name: myith-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myith}
    username: ${DB_USERNAME:myith}
    password: ${DB_PASSWORD:myith}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        hbm2ddl:
          schema_filter_provider: com.myith.core.config.WorkerOwnedTableFilter

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# JWT
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_THIS_IS_DEV_ONLY_KEY_32BYTES_1234}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}      # 30분
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}   # 7일

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# AWS S3
aws:
  s3:
    bucket: ${S3_BUCKET:myith-uploads}
    region: ${S3_REGION:ap-northeast-2}
    presign-expiry: ${S3_PRESIGN_EXPIRY:300}

# 정책값
policy:
  growth-stage:
    boundaries: [20, 50, 80]
    names: ["시작", "성장", "숙련", "완성"]
  heartbeat:
    interval-seconds: ${HEARTBEAT_INTERVAL:60}
  activity:
    throttle-minutes: ${ACTIVITY_THROTTLE:5}
  inactivity:
    threshold-hours: ${INACTIVITY_THRESHOLD:48}
  nudge:
    cooldown-hours: ${NUDGE_COOLDOWN:24}
  cache:
    dashboard-ttl-seconds: ${CACHE_DASHBOARD_TTL:600}
    job-profile-ttl-seconds: ${CACHE_JOB_PROFILE_TTL:3600}
    master-data-ttl-seconds: ${CACHE_MASTER_TTL:86400}
  mastery:
    already-known-threshold: ${MASTERY_THRESHOLD:0.66}
  guidance:
    # M 이하 최대값으로 매핑: M=0→none, M=0.33→aware, M=0.66→experienced, M=1.0→proficient
    tier-boundaries: 0.0,0.33,0.66,1.0
    tier-names: none,aware,experienced,proficient
  optimistic-lock:
    max-retries: ${LOCK_MAX_RETRIES:3}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL:1000}
    max-retries: ${OUTBOX_MAX_RETRIES:5}
  messaging:
    core-exchange: ${CORE_EXCHANGE:myith.core.events}
  roadmap:
    max-experiences: ${ROADMAP_MAX_EXPERIENCES:3}
  ai-enhancement:
    result-ttl-minutes: ${AI_ENHANCEMENT_TTL:30}
    timeout-seconds: ${AI_ENHANCEMENT_TIMEOUT:60}
  collect:
    cron: ${COLLECT_CRON:0 0 4 * * MON}
    enabled: ${COLLECT_ENABLED:true}
  consistency:
    max-retries: ${CONSISTENCY_MAX_RETRIES:3}
  analysis:
    timeout-seconds: ${ANALYSIS_TIMEOUT:120}
  upload:
    max-size-bytes: ${UPLOAD_MAX_SIZE:10485760}
    allowed-extensions: pdf,zip,tar.gz,png,jpg,jpeg

myith:
  nudge:
    messages:
      ABSENCE_48H: "이틀 동안 못 봤어요. 오늘 퀘스트 하나만 해볼까요?"
  demo:
    enabled: ${MYITH_DEMO_ENABLED:false}
    token: ${MYITH_DEMO_TOKEN:}

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json
